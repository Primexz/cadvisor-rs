[package]
name = "cadvisor-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Primexz"]
description = "A lightweight Linux container resource exporter with cAdvisor-compatible Prometheus metrics"
repository = "https://github.com/Primexz/cadvisor-rs"
readme = "README.md"
keywords = ["prometheus", "containers", "cgroups", "monitoring", "docker"]
categories = ["command-line-utilities"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustix = { version = "1", features = ["fs", "param"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "time", "sync"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
